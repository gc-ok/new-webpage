<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GC Education Analytics social preview</title>
  <desc id="desc">A branded card for custom school analytics, workflow automation, and AI training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10223a"/>
      <stop offset="1" stop-color="#2d7f88"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="lines" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect x="0" y="32" width="130" height="34" rx="17" fill="#9bd7de" opacity="0.12"/>
      <rect x="44" y="112" width="160" height="34" rx="17" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#lines)"/>
  <circle cx="1010" cy="90" r="190" fill="#70c5cd" opacity="0.14"/>
  <circle cx="150" cy="540" r="220" fill="#ffffff" opacity="0.08"/>
  <rect x="74" y="72" width="1052" height="486" rx="44" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
  <g transform="translate(120 120)">
    <rect width="96" height="96" rx="24" fill="#ffffff" opacity="0.12"/>
    <path d="M26 31c13-9 27-9 43 0v38c-16-8-30-8-43 0V31Z" fill="none" stroke="#e7edf6" stroke-width="5" stroke-linejoin="round"/>
    <path d="M69 31c10-5 20-5 31 0v38c-11-5-21-5-31 0V31Z" fill="none" stroke="#e7edf6" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <text x="120" y="270" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">
    GC Education Analytics
  </text>
  <text x="120" y="350" fill="#d9e5f2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600">
    School data analytics, custom tools, and AI training.
  </text>
  <g transform="translate(120 420)">
    <rect width="226" height="54" rx="27" fill="#70c5cd" opacity="0.95"/>
    <text x="28" y="36" fill="#07111f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">K-12 workflow automation</text>
    <rect x="246" width="190" height="54" rx="27" fill="#ffffff" opacity="0.13"/>
    <text x="274" y="36" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">FERPA-aware</text>
    <rect x="456" width="202" height="54" rx="27" fill="#ffffff" opacity="0.13"/>
    <text x="484" y="36" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Google Workspace</text>
  </g>
